version: '3.8'

services:
  # Ollama service for local LLM
  ollama:
    image: ollama/ollama:latest
    container_name: vehicle-price-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Main application service
  app:
    build: 
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: vehicle-price-predictor
    ports:
      - "8000:8000"
    environment:
      # AI Configuration - Updated for Ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      - USE_OLLAMA=true
      - OLLAMA_MODEL=llama3.2:3b
      - EMBEDDING_MODEL=nomic-embed-text:latest
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      
      # Application Configuration
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000","http://localhost:8080"]}
      
      # Database Configuration
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/predictions.db}
      
      # Cache Configuration
      - USE_REDIS_CACHE=true
      - REDIS_URL=redis://redis:6379/0
      
      # Performance Configuration
      - WORKERS=${WORKERS:-1}
      - MAX_REQUESTS=${MAX_REQUESTS:-1000}
      - TIMEOUT=${TIMEOUT:-30}
    
    volumes:
      # Persistent data storage
      - ./data:/app/data:ro
      - ./logs:/app/logs
      - ./predictions.db:/app/predictions.db
      - ./faiss_index:/app/faiss_index
      
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    depends_on:
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    networks:
      - vehicle-price-network

  # Redis for caching (optional but recommended for production)
  redis:
    image: redis:7-alpine
    container_name: vehicle-price-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - vehicle-price-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx reverse proxy (for production)
  nginx:
    image: nginx:alpine
    container_name: vehicle-price-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/usr/share/nginx/html/static:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - vehicle-price-network

  # Monitoring with Prometheus (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: vehicle-price-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - vehicle-price-network
    profiles:
      - monitoring

  # Grafana for visualization (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: vehicle-price-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - vehicle-price-network
    profiles:
      - monitoring

  # Ollama model setup service
  ollama-setup:
    image: ollama/ollama:latest
    container_name: vehicle-price-ollama-setup
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=ollama:11434
    command: >
      sh -c "
        echo 'Waiting for Ollama to be ready...' &&
        sleep 10 &&
        echo 'Pulling Ollama models...' &&
        ollama pull llama3.2:3b &&
        ollama pull nomic-embed-text:latest &&
        echo 'Models downloaded successfully!'
      "
    restart: "no"
    networks:
      - vehicle-price-network

# Named volumes for persistent data
volumes:
  redis_data:
    driver: local
  nginx_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  ollama_data:
    driver: local

# Custom network
networks:
  vehicle-price-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
